name: Validate starter
on:
  pull_request:
  push:
    branches: [main, feat/koshi-foundation]
permissions:
  contents: read
jobs:
  validate:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: '22'
          cache: npm
      - run: npm ci
      - run: npm run test:architecture
      - run: npm run build
      - run: node --test tests/tokens.test.mjs
      - run: npm install --prefix .test-tools --no-package-lock --no-save @playwright/test@1.51.1
      - run: ln -s ../.test-tools/node_modules/@playwright node_modules/@playwright
      - run: node .test-tools/node_modules/@playwright/test/cli.js install --with-deps chromium firefox webkit
      - run: node .test-tools/node_modules/@playwright/test/cli.js test
