name: Validate starter
on:
  pull_request:
  push:
    branches: [main, feat/koshi-foundation]
permissions:
  contents: read
jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - run: npm ci
      - run: npm run test:architecture
      - run: npm run build
      - run: node --test tests/tokens.test.mjs
      - run: npm install --no-save --package-lock=false @playwright/test@1.51.1
      - run: npx playwright install --with-deps chromium firefox webkit
      - run: npx playwright test
