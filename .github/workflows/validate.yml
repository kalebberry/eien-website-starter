name: Validate starter
on:
  pull_request:
  push:
    branches: [main, feat/koshi-foundation]
permissions:
  contents: read
jobs:
  validate:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: '22'
          cache: npm
      - run: npm ci
      - run: npm run test:setup
      - run: npm run test:browsers -- --with-deps
      - run: npm run validate
